name: Daily market report

on:
  push:
    branches: [main]
  schedule:
    # 22:37 UTC = 18:37 ET during daylight time / 17:37 ET during standard time.
    # Both are safely after the regular US market close, without timezone-aware scheduling.
    - cron: "37 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      TZ: America/Winnipeg

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run offline test suite
        run: python -m pytest -p no:cacheprovider -q

      - name: Generate market outputs
        run: python main.py --output-dir build/run

      - name: Build static site
        run: python -m src.site --input-dir build/run --site-dir build/site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
